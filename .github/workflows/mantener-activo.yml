# Mantiene activo el proyecto gratuito de Supabase (Liga_JBA).
# Supabase pausa los proyectos gratuitos tras 7 días sin actividad; la liga
# solo se usa en las fechas, así que todos los días hacemos varias lecturas
# pequeñas con la clave pública del sitio (la misma que está en liga.js).
# Supabase pide "unas pocas consultas a la base cada día": con cada 2 días
# igual pausó el proyecto el 27-10-2026.
# También se puede correr a mano: pestaña Actions > Mantener Supabase activo > Run workflow.
name: Mantener Supabase activo

on:
  schedule:
    - cron: "17 13 * * *"     # todos los días, ~10:17 hora de Chile (13:17 UTC)
    - cron: "43 23 * * *"     # y de nuevo en la tarde, ~20:43 hora de Chile
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar la base de la liga
        env:
          URL: https://esycnxngndybogjlscjd.supabase.co/rest/v1
          KEY: sb_publishable_9e6qqnmHHkYTwX1-HMH7XQ_iOmTQXUt
        run: |
          set -e
          for ruta in "temporadas?select=id,nombre&limit=1" "v_tabla_general?select=posicion,total&limit=5" "fechas?select=numero,dia" "categorias?select=id&limit=20" "v_podios?select=categoria,lugar&limit=20"; do
            codigo=$(curl -s -o respuesta.json -w "%{http_code}" -H "apikey: $KEY" "$URL/$ruta")
            echo "$ruta -> HTTP $codigo"
            cat respuesta.json; echo
            if [ "$codigo" != "200" ]; then
              echo "::error::La base no respondió bien (HTTP $codigo). Si dice que el proyecto está pausado, entra a Supabase y toca 'Resume project'."
              exit 1
            fi
          done
