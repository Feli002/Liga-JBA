<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Marcador Kumite — WUKF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root{
    --tatami:#0c1210;
    --tatami-2:#101a17;
    --aka:#c8262c;
    --aka-deep:#7d1418;
    --shiro:#f4f1e9;
    --shiro-deep:#cfcabd;
    --gold:#c98a2e;
    --gold-deep:#a06a1f;
    --ink:#0c1210;
    --paper:#eee9dd;
    --line:rgba(238,233,221,0.14);
    --danger:#e14b3c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(217,169,65,0.08), transparent 60%),
      repeating-linear-gradient(90deg, var(--tatami-2) 0 2px, var(--tatami) 2px 68px),
      var(--tatami);
    color:var(--paper);
    font-family:'Oswald', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
  }

  /* ---------- HEADER / TIMER BAR ---------- */
  .timer-bar{
    position:relative;
    z-index:5;
    padding:14px clamp(12px,3vw,28px) 16px;
    background:linear-gradient(180deg, #0a100e, #0d1512 90%);
    border-bottom:1px solid var(--line);
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
  }
  .brand-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    max-width:900px;
    margin:0 auto 6px;
  }
  .brand{
    font-size:11px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--gold);
    opacity:0.85;
  }
  .match-label{
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:#8b9490;
    text-align:right;
  }

  .timer-core{
    max-width:900px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
  }

  .clock-wrap{
    display:flex;
    align-items:center;
    gap:clamp(10px,3vw,26px);
  }
  .clock{
    font-family:'Bebas Neue', 'Oswald', sans-serif;
    font-size:clamp(56px, 15vw, 108px);
    line-height:1;
    letter-spacing:0.02em;
    font-variant-numeric: tabular-nums;
    color:var(--paper);
    text-shadow:0 0 30px rgba(217,169,65,0.18);
    user-select:none;
    transition:color .15s ease;
  }
  .clock.running{ color:var(--gold); }
  .clock.low-time{ color:var(--danger); animation:pulse 1s infinite; }
  @keyframes pulse{
    0%,100%{opacity:1;}
    50%{opacity:0.55;}
  }

  .timer-btn{
    width:clamp(52px,10vw,64px);
    height:clamp(52px,10vw,64px);
    border-radius:50%;
    border:1.5px solid var(--line);
    background:rgba(238,233,221,0.04);
    color:var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:transform .12s ease, background .12s ease, border-color .12s ease;
    flex:none;
  }
  .timer-btn:active{ transform:scale(0.92); }
  .timer-btn svg{ width:44%; height:44%; }
  .timer-btn.play{
    background:linear-gradient(180deg, var(--gold), var(--gold-deep));
    border-color:transparent;
    color:var(--ink);
  }
  .timer-btn.reset{
    color:#8b9490;
  }
  .timer-btn.reset:hover{ color:var(--paper); border-color:var(--paper); }

  .custom-time-row{
    display:flex;
    align-items:center;
    gap:10px;
    background:rgba(238,233,221,0.04);
    border:1px solid var(--line);
    border-radius:999px;
    padding:6px 8px 6px 18px;
  }
  .custom-time-row .ctr-label{
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:#8b9490;
  }
  .custom-time-row input{
    width:40px;
    background:transparent;
    border:none;
    border-bottom:1px solid rgba(238,233,221,0.35);
    color:var(--paper);
    font-family:'Oswald', sans-serif;
    font-size:15px;
    font-weight:500;
    text-align:center;
    padding:3px 0;
  }
  .custom-time-row input:focus{ outline:none; border-color:var(--gold); color:var(--gold); }
  .custom-time-row .sep{ color:#8b9490; font-size:15px; }
  #applyCustom{
    background:var(--gold);
    border:none;
    color:var(--ink);
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    padding:9px 16px;
    border-radius:999px;
    cursor:pointer;
  }
  #applyCustom:active{ transform:scale(0.96); }

  /* ---------- CATEGORY SELECTOR (entre los dos marcadores) ---------- */
  .category-divider{
    flex:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:18px 10px;
    background:#0a100e;
    position:relative;
    z-index:3;
  }
  @media (min-width:641px){
    .category-divider{
      width:150px;
      box-shadow:-6px 0 16px rgba(0,0,0,0.25), 6px 0 16px rgba(0,0,0,0.25);
    }
  }
  @media (max-width:640px){
    .category-divider{ flex-direction:row; padding:12px 16px; }
  }
  .cat-title{
    font-size:10px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:#8b9490;
    text-align:center;
  }
  @media (max-width:640px){ .cat-title{ display:none; } }
  .cat-btn{
    width:100%;
    background:rgba(238,233,221,0.05);
    border:1.5px solid var(--line);
    color:#b7bcb6;
    border-radius:12px;
    padding:10px 8px;
    cursor:pointer;
    font-family:'Oswald', sans-serif;
    transition:all .12s ease;
    text-align:center;
  }
  @media (max-width:640px){ .cat-btn{ width:auto; flex:1; padding:8px 10px; } }
  .cat-btn .cat-name{
    display:block;
    font-size:13px;
    font-weight:600;
    letter-spacing:0.03em;
  }
  .cat-btn .cat-sub{
    display:block;
    font-size:10px;
    color:#8b9490;
    margin-top:2px;
    letter-spacing:0.02em;
  }
  .cat-btn.active{
    background:var(--gold);
    border-color:var(--gold);
    color:var(--ink);
  }
  .cat-btn.active .cat-sub{ color:rgba(12,18,16,0.65); }

  /* ---------- WIN BANNER ---------- */
  .win-banner{
    position:sticky;
    top:0;
    z-index:20;
    display:none;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:12px 16px;
    font-family:'Oswald', sans-serif;
    font-weight:600;
    letter-spacing:0.06em;
    text-transform:uppercase;
    font-size:clamp(13px,3vw,16px);
  }
  .win-banner.show{ display:flex; }
  .win-banner.aka{ background:var(--aka); color:var(--shiro); }
  .win-banner.shiro{ background:var(--shiro); color:var(--ink); }
  .win-banner button{
    background:rgba(0,0,0,0.15);
    border:none;
    color:inherit;
    width:24px;
    height:24px;
    border-radius:50%;
    cursor:pointer;
    font-size:13px;
    line-height:1;
  }

  /* ---------- SCORE AREA ---------- */
  .arena{
    flex:1;
    display:flex;
    min-height:0;
  }
  @media (max-width:640px){
    .arena{ flex-direction:column; }
  }

  .side{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:20px 16px 24px;
    min-height:0;
    transition:box-shadow .2s ease;
  }
  .side.aka{
    background:linear-gradient(160deg, var(--aka) 0%, var(--aka-deep) 100%);
    color:var(--shiro);
  }
  .side.shiro{
    background:linear-gradient(160deg, var(--shiro) 0%, var(--shiro-deep) 100%);
    color:var(--ink);
  }
  .side.winner{
    box-shadow: inset 0 0 0 5px var(--gold);
  }

  .competitor-label{
    position:absolute;
    top:16px;
    font-size:clamp(13px,2.4vw,16px);
    letter-spacing:0.32em;
    text-transform:uppercase;
    font-weight:600;
    opacity:0.85;
  }
  .side.aka .competitor-label{ left:20px; }
  .side.shiro .competitor-label{ right:20px; }

  .senshu{
    position:absolute;
    top:16px;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    padding:4px 10px;
    border-radius:999px;
    border:1px solid currentColor;
    opacity:0;
    transform:translateY(-4px);
    transition:opacity .15s ease, transform .15s ease;
    cursor:pointer;
  }
  .senshu.active{ opacity:0.95; transform:translateY(0); }
  .side.aka .senshu{ right:20px; }
  .side.shiro .senshu{ left:20px; }

  .score{
    font-family:'Bebas Neue', 'Oswald', sans-serif;
    font-size:clamp(110px, 24vw, 230px);
    line-height:0.9;
    user-select:none;
    cursor:pointer;
    transition:transform .08s ease;
  }
  .score:active{ transform:scale(0.96); }

  .score-target{
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    opacity:0.6;
    margin-top:-4px;
    margin-bottom:6px;
  }

  .point-buttons{
    display:flex;
    gap:10px;
    margin-top:4px;
  }
  .pt-btn{
    min-width:84px;
    padding:10px 14px;
    border-radius:14px;
    border:none;
    font-family:'Oswald', sans-serif;
    font-weight:600;
    cursor:pointer;
    transition:transform .1s ease, filter .1s ease;
    display:flex;
    flex-direction:column;
    align-items:center;
    line-height:1.15;
  }
  .pt-btn .pt-name{ font-size:12px; letter-spacing:0.06em; text-transform:uppercase; }
  .pt-btn .pt-val{ font-size:19px; font-weight:700; }
  .pt-btn:active{ transform:scale(0.9); }
  .side.aka .pt-btn{
    background:rgba(244,241,233,0.14);
    color:var(--shiro);
    border:1px solid rgba(244,241,233,0.35);
  }
  .side.aka .pt-btn:hover{ background:rgba(244,241,233,0.24); }
  .side.shiro .pt-btn{
    background:rgba(12,18,16,0.06);
    color:var(--ink);
    border:1px solid rgba(12,18,16,0.2);
  }
  .side.shiro .pt-btn:hover{ background:rgba(12,18,16,0.1); }

  .minus-row{
    margin-top:12px;
  }
  .minus-btn{
    background:none;
    border:none;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    cursor:pointer;
    opacity:0.55;
    padding:6px 8px;
  }
  .minus-btn:hover{ opacity:0.95; }
  .side.aka .minus-btn{ color:var(--shiro); }
  .side.shiro .minus-btn{ color:var(--ink); }

  /* ---------- PENALTIES ---------- */
  .penalty-block{
    display:flex;
    gap:8px;
    margin-top:16px;
    width:100%;
    max-width:280px;
  }
  .penalty-btn{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    border-radius:12px;
    padding:8px 6px;
    cursor:pointer;
    font-family:'Oswald', sans-serif;
    transition:all .12s ease;
    background:transparent;
  }
  .side.aka .penalty-btn{ border:1px solid rgba(244,241,233,0.35); }
  .side.shiro .penalty-btn{ border:1px solid rgba(12,18,16,0.25); }
  .penalty-label{
    font-size:10.5px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    opacity:0.8;
  }
  .dots{ display:flex; gap:5px; }
  .dots i{
    display:block;
    width:9px;
    height:9px;
    border-radius:50%;
    border:1.5px solid currentColor;
    opacity:0.5;
  }
  .dots i.filled{
    opacity:1;
    background:currentColor;
  }
  .penalty-btn.critical{
    background:var(--danger);
    border-color:var(--danger);
  }
  .side.aka .penalty-btn.critical, .side.shiro .penalty-btn.critical{ color:var(--shiro); }
  .penalty-btn.critical .penalty-label{ opacity:1; font-weight:600; }

  /* ---------- FOOTER ---------- */
  .footer{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    padding:12px;
    background:#0a100e;
    border-top:1px solid var(--line);
  }
  .footer button{
    background:none;
    border:none;
    color:#8b9490;
    font-family:'Oswald', sans-serif;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .footer button:hover{ color:var(--paper); }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.55);
    display:none; align-items:center; justify-content:center; z-index:50;
  }
  .modal-backdrop.open{ display:flex; }
  .modal{
    background:#121915;
    border:1px solid var(--line);
    border-radius:16px;
    padding:26px 28px;
    width:min(320px, 90vw);
    text-align:center;
  }
  .modal h3{ margin:0 0 8px; font-weight:600; letter-spacing:0.04em; }
  .modal p{ margin:0 0 20px; color:#8b9490; font-size:14px; }
  .modal-actions{ display:flex; gap:10px; justify-content:center; }
  .modal-actions button{
    flex:1;
    padding:10px 0;
    border-radius:10px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--paper);
    font-family:'Oswald', sans-serif;
    letter-spacing:0.06em;
    text-transform:uppercase;
    font-size:13px;
    cursor:pointer;
  }
  .modal-actions button.confirm{
    background:var(--danger);
    border-color:var(--danger);
    color:#fff;
  }

  /* ---------- SITE BANNER (compartido en toda la línea gráfica) ---------- */
  .site-banner{
    position:relative;
    width:100%;
    height:64px;
    overflow:hidden;
    background:#000;
    border-bottom:1px solid var(--line);
    flex:none;
  }
  .site-banner img{ width:100%; height:100%; object-fit:cover; display:block; }
  .site-banner .banner-back{
    position:absolute; left:12px; top:50%; transform:translateY(-50%);
    background:rgba(12,18,16,0.55);
    color:var(--paper);
    font-family:'Oswald', sans-serif;
    font-size:12px;
    letter-spacing:0.06em;
    text-decoration:none;
    padding:6px 12px;
    border-radius:999px;
    display:flex; align-items:center; gap:5px;
    transition:background .12s ease;
  }
  .site-banner .banner-back:hover{ background:rgba(12,18,16,0.8); }
</style>
</head>

        <button class="penalty-btn" data-side="aka" data-type="kinshi">
          <span class="penalty-label">Kinshi</span>
          <span class="dots" data-max="4"><i></i><i></i><i></i><i></i></span>
        </button>
      </div>
    </div>

    <div class="category-divider">
      <span class="cat-title">Meta del combate</span>
      <button class="cat-btn" data-cat="nihon" data-target="4" data-label="Shobu Nihon · 2 Ippon (4 Waza-ari)">
        <span class="cat-name">Shobu Nihon</span>
        <span class="cat-sub">2 Ippon (4 Waza-ari) · Niños</span>
      </button>
      <button class="cat-btn active" data-cat="sanbon" data-target="6" data-label="Shobu Sanbon · 3 Ippon (6 Waza-ari)">
        <span class="cat-name">Shobu Sanbon</span>
        <span class="cat-sub">3 Ippon (6 Waza-ari) · Estándar</span>
      </button>
    </div>

    <div class="side shiro" id="sideShiro">
      <div class="competitor-label">Shiro</div>
      <div class="senshu" id="senshuShiro" title="Marcar Senshu">Senshu</div>
      <div class="score" id="scoreShiro">0</div>
      <div class="score-target" id="targetShiro">meta: 6</div>
      <div class="point-buttons">
        <button class="pt-btn" data-side="shiro" data-pts="1">
          <span class="pt-name">Waza-ari</span><span class="pt-val">+1</span>
        </button>
        <button class="pt-btn" data-side="shiro" data-pts="2">
          <span class="pt-name">Ippon</span><span class="pt-val">+2</span>
        </button>
      </div>
      <div class="minus-row">
        <button class="minus-btn" data-side="shiro">− Corregir punto</button>
      </div>
      <div class="penalty-block">
        <button class="penalty-btn" data-side="shiro" data-type="atenai">
          <span class="penalty-label">Atenai</span>
          <span class="dots" data-max="3"><i></i><i></i><i></i></span>
        </button>
        <button class="penalty-btn" data-side="shiro" data-type="kinshi">
          <span class="penalty-label">Kinshi</span>
          <span class="dots" data-max="4"><i></i><i></i><i></i><i></i></span>
        </button>
      </div>
    </div>
  </div>

  <div class="footer">
    <button id="newMatchBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12a8 8 0 0 1 14.93-4"></path><path d="M20 4v5h-5"></path><path d="M20 12a8 8 0 0 1-14.93 4"></path><path d="M4 20v-5h5"></path></svg>
      Nuevo combate
    </button>
  </div>

  <div class="modal-backdrop" id="confirmModal">
    <div class="modal">
      <h3>¿Nuevo combate?</h3>
      <p>Se reiniciarán los puntajes, castigos y el tiempo.</p>
      <div class="modal-actions">
        <button id="cancelReset">Cancelar</button>
        <button class="confirm" id="confirmReset">Reiniciar</button>
      </div>
    </div>
  </div>

<script>
(function(){
  // ---------- STATE ----------
  let totalSeconds = 180;
  let remaining = 180;
  let running = false;
  let tickHandle = null;
  let lastTick = null;

  let category = 'sanbon';
  let target = 6; // en unidades de waza-ari (ippon = 2, waza-ari = 1)

  let scores = { aka:0, shiro:0 };
  let penalties = {
    aka:{ atenai:0, kinshi:0 },
    shiro:{ atenai:0, kinshi:0 }
  };
  let senshu = { aka:false, shiro:false };
  let winner = null;

  // ---------- ELEMENTS ----------
  const clockEl = document.getElementById('clock');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const pauseIcon = document.getElementById('pauseIcon');
  const resetBtn = document.getElementById('resetBtn');
  const categoryLabel = document.getElementById('categoryLabel');
  const winBanner = document.getElementById('winBanner');
  const winText = document.getElementById('winText');
  const sideAkaEl = document.getElementById('sideAka');
  const sideShiroEl = document.getElementById('sideShiro');

  function formatTime(s){
    const m = Math.floor(s/60);
    const sec = s%60;
    return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
  }

  function renderClock(){
    clockEl.textContent = formatTime(Math.max(0,remaining));
    clockEl.classList.toggle('running', running);
    clockEl.classList.toggle('low-time', remaining<=10 && remaining>0);
  }

  function tick(ts){
    if(!running) return;
    if(lastTick==null) lastTick = ts;
    const delta = (ts - lastTick)/1000;
    if(delta >= 1){
      const steps = Math.floor(delta);
      remaining = Math.max(0, remaining - steps);
      lastTick = ts - (delta-steps)*1000;
      renderClock();
      if(remaining<=0){
        pause();
        clockEl.classList.remove('low-time');
        return;
      }
    }
    tickHandle = requestAnimationFrame(tick);
  }

  function play(){
    if(remaining<=0) return;
    running = true;
    lastTick = null;
    playIcon.style.display='none';
    pauseIcon.style.display='block';
    tickHandle = requestAnimationFrame(tick);
    renderClock();
  }
  function pause(){
    running = false;
    playIcon.style.display='block';
    pauseIcon.style.display='none';
    if(tickHandle) cancelAnimationFrame(tickHandle);
    renderClock();
  }

  playBtn.addEventListener('click', ()=> running ? pause() : play());
  resetBtn.addEventListener('click', ()=>{ pause(); remaining = totalSeconds; renderClock(); });

  document.getElementById('applyCustom').addEventListener('click', ()=>{
    const min = Math.max(0, parseInt(document.getElementById('customMin').value,10) || 0);
    const sec = Math.max(0, Math.min(59, parseInt(document.getElementById('customSec').value,10) || 0));
    const secs = min*60+sec;
    if(secs<=0) return;
    pause();
    totalSeconds = secs;
    remaining = secs;
    renderClock();
  });

  // ---------- CATEGORY (Shobu Nihon / Shobu Sanbon) ----------
  document.querySelectorAll('.cat-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      category = btn.dataset.cat;
      target = parseInt(btn.dataset.target,10);
      categoryLabel.textContent = btn.dataset.label;
      document.getElementById('targetAka').textContent = 'meta: ' + target;
      document.getElementById('targetShiro').textContent = 'meta: ' + target;
      checkWinner();
    });
  });

  // ---------- SCORES ----------
  const scoreEls = { aka: document.getElementById('scoreAka'), shiro: document.getElementById('scoreShiro') };

  function renderScore(side){
    scoreEls[side].textContent = scores[side];
  }

  function otherSide(side){ return side === 'aka' ? 'shiro' : 'aka'; }

  function declareWinner(side, reasonText){
    if(winner) return;
    winner = side;
    pause();
    document.getElementById(side === 'aka' ? 'sideAka' : 'sideShiro').classList.add('winner');
    winBanner.className = 'win-banner show ' + side;
    winText.textContent = (side === 'aka' ? 'AKA GANA' : 'SHIRO GANA') + ' — ' + reasonText;
  }

  function checkWinner(){
    if(winner) return;
    if(scores.aka >= target){ declareWinner('aka', 'meta alcanzada (' + scores.aka + '/' + target + ')'); }
    else if(scores.shiro >= target){ declareWinner('shiro', 'meta alcanzada (' + scores.shiro + '/' + target + ')'); }
  }

  document.querySelectorAll('.pt-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(winner) return;
      const side = btn.dataset.side;
      const pts = parseInt(btn.dataset.pts,10);
      scores[side]+=pts;
      renderScore(side);
      checkWinner();
    });
  });

  document.querySelectorAll('.minus-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const side = btn.dataset.side;
      scores[side] = Math.max(0, scores[side]-1);
      renderScore(side);
    });
  });

  // tap the big number itself = +1 (waza-ari) rápido
  scoreEls.aka.addEventListener('click', ()=>{ if(winner) return; scores.aka++; renderScore('aka'); checkWinner(); });
  scoreEls.shiro.addEventListener('click', ()=>{ if(winner) return; scores.shiro++; renderScore('shiro'); checkWinner(); });

  // ---------- PENALTIES (Atenai / Kinshi) ----------
  const PENALTY_LABELS = {
    atenai: ['Atenai', 'Atenai Chui', 'Atenai Hansoku'],
    kinshi: ['Kinshi', 'Kinshi Ni', 'Kinshi Chui', 'Kinshi Hansoku']
  };

  document.querySelectorAll('.penalty-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(winner) return;
      const side = btn.dataset.side;
      const type = btn.dataset.type;
      const dotsEl = btn.querySelector('.dots');
      const max = parseInt(dotsEl.dataset.max,10);
      if(penalties[side][type] >= max) return;
      penalties[side][type]++;
      const count = penalties[side][type];
      dotsEl.querySelectorAll('i').forEach((dot,i)=>{
        dot.classList.toggle('filled', i < count);
      });
      if(count >= max){
        btn.classList.add('critical');
        const label = PENALTY_LABELS[type][max-1];
        declareWinner(otherSide(side), 'descalificación (' + label + ' en ' + (side==='aka'?'Aka':'Shiro') + ')');
      }
    });
  });

  // ---------- SENSHU ----------
  const senshuAka = document.getElementById('senshuAka');
  const senshuShiro = document.getElementById('senshuShiro');
  senshuAka.addEventListener('click', ()=>{
    senshu.aka = !senshu.aka;
    if(senshu.aka){ senshu.shiro=false; senshuShiro.classList.remove('active'); }
    senshuAka.classList.toggle('active', senshu.aka);
  });
  senshuShiro.addEventListener('click', ()=>{
    senshu.shiro = !senshu.shiro;
    if(senshu.shiro){ senshu.aka=false; senshuAka.classList.remove('active'); }
    senshuShiro.classList.toggle('active', senshu.shiro);
  });

  // ---------- WIN BANNER DISMISS ----------
  document.getElementById('dismissBanner').addEventListener('click', ()=>{
    winBanner.classList.remove('show');
  });

  // ---------- NEW MATCH ----------
  const modal = document.getElementById('confirmModal');
  document.getElementById('newMatchBtn').addEventListener('click', ()=> modal.classList.add('open'));
  document.getElementById('cancelReset').addEventListener('click', ()=> modal.classList.remove('open'));
  document.getElementById('confirmReset').addEventListener('click', ()=>{
    pause();
    scores = {aka:0, shiro:0};
    renderScore('aka'); renderScore('shiro');
    penalties = { aka:{atenai:0,kinshi:0}, shiro:{atenai:0,kinshi:0} };
    document.querySelectorAll('.penalty-btn').forEach(btn=>{
      btn.classList.remove('critical');
      btn.querySelectorAll('.dots i').forEach(dot=>dot.classList.remove('filled'));
    });
    senshu = {aka:false, shiro:false};
    senshuAka.classList.remove('active');
    senshuShiro.classList.remove('active');
    winner = null;
    sideAkaEl.classList.remove('winner');
    sideShiroEl.classList.remove('winner');
    winBanner.classList.remove('show');
    remaining = totalSeconds;
    renderClock();
    modal.classList.remove('open');
  });

  renderClock();
})();
</script>

</body>
</html>
